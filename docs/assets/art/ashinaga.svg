<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <title>Ashinaga, the long-legged yōkai</title>
  <desc>A tall ink cartoon with gently winding legs, a topknot, a wrapped robe, and straw sandals. Every body part is a separate editable group.</desc>
